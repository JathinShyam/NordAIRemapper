name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: debug-apk-release
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Assemble debug APK + update release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name APK for release
        id: apk
        run: |
          mkdir -p dist
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILT_AT="$(date -u +%Y-%m-%d)"
          OUT="dist/NordAIRemapper-debug-${SHORT_SHA}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$OUT"
          cp app/build/outputs/apk/debug/app-debug.apk dist/NordAIRemapper-debug-latest.apk
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "built_at=$BUILT_AT" >> "$GITHUB_OUTPUT"
          echo "sha_apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "version_tag=debug-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - name: Attach APK to this workflow run
        uses: actions/upload-artifact@v4
        with:
          name: NordAIRemapper-debug-${{ steps.apk.outputs.short_sha }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish versioned debug release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.version_tag }}
          name: Debug · ${{ steps.apk.outputs.short_sha }} · ${{ steps.apk.outputs.built_at }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          generate_release_notes: true
          body: |
            Debug APK for commit `${{ github.sha }}` (${{ steps.apk.outputs.built_at }}).

            - Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Always-current build: ${{ github.server_url }}/${{ github.repository }}/releases/tag/latest-debug

            ### Install
            Download **NordAIRemapper-debug-${{ steps.apk.outputs.short_sha }}.apk**.

            > If Accessibility never sees the Plus Key:
            > `adb shell pm grant com.nordairemapper android.permission.READ_LOGS`
          files: ${{ steps.apk.outputs.sha_apk }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Latest Debug pointer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Latest Debug · ${{ steps.apk.outputs.short_sha }} · ${{ steps.apk.outputs.built_at }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          generate_release_notes: false
          body: |
            Rolling **latest** debug build from `main`. Older builds are kept as separate releases tagged `debug-<sha>`.

            - This version: `${{ steps.apk.outputs.short_sha }}` (${{ steps.apk.outputs.built_at }})
            - Commit: `${{ github.sha }}`
            - This build's release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.apk.outputs.version_tag }}
            - All versions: ${{ github.server_url }}/${{ github.repository }}/releases
            - Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ### Install on phone (no PC required)
            1. Download **NordAIRemapper-debug-latest.apk** below (always this push).
            2. For an older build, open **Releases** and pick `Debug · <sha> · <date>`.
            3. Allow “Install unknown apps” if asked.

            > If Accessibility never sees the Plus Key, you may still need a one-time PC command later:
            > `adb shell pm grant com.nordairemapper android.permission.READ_LOGS`
          files: dist/NordAIRemapper-debug-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: debug-apk-release
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Assemble debug APK + update release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name APK for release
        id: apk
        run: |
          mkdir -p dist
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILT_AT="$(date -u +%Y-%m-%d)"
          OUT="dist/NordAIRemapper-debug-${SHORT_SHA}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$OUT"
          cp app/build/outputs/apk/debug/app-debug.apk dist/NordAIRemapper-debug-latest.apk
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "built_at=$BUILT_AT" >> "$GITHUB_OUTPUT"
          echo "sha_apk=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - name: Attach APK to this workflow run
        uses: actions/upload-artifact@v4
        with:
          name: NordAIRemapper-debug-${{ steps.apk.outputs.short_sha }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prune old SHA APKs from latest-debug
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA="${{ steps.apk.outputs.short_sha }}"
          if ! gh release view latest-debug >/dev/null 2>&1; then
            echo "No latest-debug release yet; skip prune."
            exit 0
          fi
          gh release view latest-debug --json assets --jq '.assets[].name' | while read -r name; do
            [ -z "$name" ] && continue
            if [ "$name" = "NordAIRemapper-debug-latest.apk" ]; then
              continue
            fi
            if [ "$name" = "NordAIRemapper-debug-${SHORT_SHA}.apk" ]; then
              continue
            fi
            echo "Deleting stale asset: $name"
            gh release delete-asset latest-debug "$name" --yes
          done

      - name: Publish / update Latest Debug release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Latest Debug · ${{ steps.apk.outputs.short_sha }} · ${{ steps.apk.outputs.built_at }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          generate_release_notes: true
          body: |
            Automatic **debug** build from `main`.

            - Version: `${{ steps.apk.outputs.short_sha }}` (${{ steps.apk.outputs.built_at }})
            - Commit: `${{ github.sha }}`
            - Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ### Install on phone (no PC required)
            1. Download **NordAIRemapper-debug-latest.apk** (always this push) **or** **NordAIRemapper-debug-${{ steps.apk.outputs.short_sha }}.apk**.
            2. Open it on the phone and allow “Install unknown apps” if asked.
            3. Complete in-app onboarding (Accessibility, etc.).

            > If Accessibility never sees the Plus Key, you may still need a one-time PC command later:
            > `adb shell pm grant com.nordairemapper android.permission.READ_LOGS`
          files: |
            dist/NordAIRemapper-debug-latest.apk
            ${{ steps.apk.outputs.sha_apk }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
